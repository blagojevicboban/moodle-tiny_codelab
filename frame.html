<html lang="en">
<head>
<meta charset="utf-8">
<title>CodeLab</title>
<link rel="stylesheet" href="thirdparty/monaco/editor.css">
<style>
html, body, #editor { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
.codelab-current-line { background: #fff3b0; }
.codelab-current-mark { background: #f0ad00; width: 4px !important; margin-left: 3px; }
</style>
</head>
<body>
<div id="editor"></div>
<script src="thirdparty/monaco/editor.js"></script>
</body>
